name: Apply reviewed FRC account-scope hardening
on:
  push:
    branches: [fix/frc-completeness-integrations-20261015]
    paths: [.github/workflows/frc-apply-security.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'PadiusD1/morgan-pantry-store' && github.ref == 'refs/heads/fix/frc-completeness-integrations-20261015'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify exact patch and unchanged source
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, subprocess
          base='4834400db5aa58cc3b7037a39e925e048303bcb9'
          subprocess.run(['git','merge-base','--is-ancestor',base,'HEAD'],check=True)
          changed=set(subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines())
          assert changed <= {'.frc-security.patch','.github/workflows/frc-apply-security.yml'}, 'Concurrent edits must be reconciled'
          data=pathlib.Path('.frc-security.patch').read_bytes()
          assert hashlib.sha256(data).hexdigest()=='ac0d34e73c624ff4c2c74ac94ecae89d07c8c10e9cc24211115d20c934a3394e'
          PY
          git apply --check --index .frc-security.patch
          git apply --index .frc-security.patch
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: enforce persisted account scope for portal requests and notifications'
          git push origin HEAD:refs/heads/fix/frc-completeness-integrations-20261015
