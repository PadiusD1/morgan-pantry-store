name: FRC quality checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frc-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: frc
          POSTGRES_DB: postgres
          # Isolated, disposable GitHub runner service; no production secret.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 55417:5432
        options: >-
          --health-cmd "pg_isready -U frc -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TZ: UTC
      FRC_TEST_PG_EXTERNAL: "1"
      FRC_TEST_PG_PORT: "55417"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Collect dependency advisory evidence
        run: node script/audit-dependencies.mjs
      - name: Typecheck
        run: npm run check
      - name: Unit regression tests
        run: npm test
      - name: Native PostgreSQL 17 integration tests
        run: npm run test:integration
      - name: Build exactly as configured for Vercel
        run: npm run build:vercel
      - name: Install Chromium and browser dependencies
        run: npx playwright install --with-deps chromium
      - name: Test the production bundle and CSP with synthetic data
        run: npm run test:e2e:production
      - name: Save browser and dependency evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: frc-browser-evidence
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore
