name: FRC source reconciliation
on:
  push:
    branches: [fix/frc-completeness-integrations-20261015]
    paths: [.github/workflows/frc-source-reconcile.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: git archive --format=tar.gz --output=/tmp/frc-current-source.tar.gz HEAD
      - uses: actions/upload-artifact@v5
        with:
          name: frc-current-source
          path: /tmp/frc-current-source.tar.gz
          retention-days: 1
