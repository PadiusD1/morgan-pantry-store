name: FRC isolated repair workspace
on:
  push:
    branches: [fix/frc-registration-reports-receipts-20261014]
    paths: [.github/workflows/frc-workspace-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22.16.0'
      - run: npm ci
      - name: Package public source and locked build tools only
        run: |
          git archive --format=tar HEAD > /tmp/frc-workspace.tar
          tar --append --file=/tmp/frc-workspace.tar node_modules
          gzip -1 /tmp/frc-workspace.tar
      - uses: actions/upload-artifact@v5
        with:
          name: frc-isolated-workspace
          path: /tmp/frc-workspace.tar.gz
          retention-days: 1
