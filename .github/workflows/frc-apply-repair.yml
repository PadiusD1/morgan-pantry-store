name: Apply verified FRC repair
on:
  push:
    branches: [fix/frc-registration-reports-receipts-20261014]
    paths: [.github/workflows/frc-apply-repair.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify and apply only the reviewed application patch
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code 5bcfdf0575338af7fe6ee84a4ecaa620de5e765e HEAD -- client shared server tests docs
          python3 - <<'PY'
          import base64, hashlib, lzma, pathlib, re
          encoded = ''.join(pathlib.Path(f'.github/frc-repair/payload-{i}.b64').read_text().strip() for i in (1, 2, 3))
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert len(patch) == 88697
          assert hashlib.sha256(patch).hexdigest() == '000b7476188feb202917815e46a9176a489ae16a290e57e1137454877d68c8ee'
          paths = re.findall(rb'^diff --git a/(\S+) b/(\S+)$', patch, re.M)
          assert len(paths) == 27
          for before, after in paths:
              assert before == after
              path = pathlib.PurePosixPath(after.decode())
              assert path.parts[0] in {'client', 'shared', 'server', 'tests', 'docs'}
              assert '..' not in path.parts and not path.is_absolute()
          pathlib.Path('/tmp/frc-repair.patch').write_bytes(patch)
          print('Verified application patch: 27 files; SHA-256 matches locally tested version.')
          PY
          git apply --unidiff-zero --check /tmp/frc-repair.patch
          git apply --unidiff-zero /tmp/frc-repair.patch
          git diff --check
          git add client shared server tests docs
          git rm .github/frc-repair/payload-1.b64 .github/frc-repair/payload-2.b64 .github/frc-repair/payload-3.b64
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: donor visibility, partner registration, selected board reports and valued receipts'
          git push origin HEAD:fix/frc-registration-reports-receipts-20261014
